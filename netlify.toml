[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Revisa el Substack y suma cartas nuevas una vez por semana, sin intervención manual.
[functions."sync-substack"]
  schedule = "@weekly"

# Actualiza la BBDD de Notion (socias y compras) una vez por semana.
[functions."sync-bbdd"]
  schedule = "@weekly"

# Mantiene la lista de Brevo "Socixs del club" al día una vez por semana.
[functions."sync-brevo-socias"]
  schedule = "@weekly"

# Recordatorio a quien empezó el alta de fundadora y no completó el pago,
# un día después de haber empezado.
[functions."remind-founder-applications"]
  schedule = "@daily"

# URLs lindas para las cartas: /cartas/el-mito-de-la-desconexion en vez de
# /carta.html?c=el-mito-de-la-desconexion (mejor para SEO y para compartir).
[[redirects]]
  from = "/cartas/:slug"
  to = "/carta.html?c=:slug"
  status = 200

# URL linda para el taller "Una vida de fantasía".
[[redirects]]
  from = "/encuentros/una-vida-de-fantasia"
  to = "/encuentro-una-vida-de-fantasia.html"
  status = 200

# URL linda para el taller "La erótica del buentrato".
[[redirects]]
  from = "/encuentros/la-erotica-del-buentrato"
  to = "/encuentro-la-erotica-del-buentrato.html"
  status = 200
