[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Revisa el Substack y suma cartas nuevas una vez por semana, sin intervención manual.
[functions."sync-substack"]
  schedule = "@weekly"

# Actualiza la BBDD de Notion (socias y compras) una vez por semana.
[functions."sync-bbdd"]
  schedule = "@weekly"

# Mantiene la lista de Brevo "Socixs del club" al día una vez por semana.
[functions."sync-brevo-socias"]
  schedule = "@weekly"

# Recordatorio a quien empezó el alta de fundadora y no completó el pago,
# un día después de haber empezado.
[functions."remind-founder-applications"]
  schedule = "@daily"

# Aviso a las fundadoras: el 3 de enero empieza la cuota de 11 € y, si se dan
# de baja, no pueden volver a entrar como fundadoras. 08:00 UTC = 09:00 en
# Madrid (invierno). La función solo envía en 2026.
[functions."founder-billing-notice"]
  schedule = "0 8 30 12 *"

# URLs lindas para las cartas: /cartas/el-mito-de-la-desconexion en vez de
# /carta.html?c=el-mito-de-la-desconexion (mejor para SEO y para compartir).
[[redirects]]
  from = "/cartas/:slug"
  to = "/carta.html?c=:slug"
  status = 200

# URL linda para el taller "Una vida de fantasía".
[[redirects]]
  from = "/encuentros/una-vida-de-fantasia"
  to = "/encuentro-una-vida-de-fantasia.html"
  status = 200

# URL linda para el taller "La erótica del buentrato".
[[redirects]]
  from = "/encuentros/la-erotica-del-buentrato"
  to = "/encuentro-la-erotica-del-buentrato.html"
  status = 200

# URL linda para el taller "Lo que el hambre sabe".
[[redirects]]
  from = "/encuentros/lo-que-el-hambre-sabe"
  to = "/encuentro-lo-que-el-hambre-sabe.html"
  status = 200

# Caché de un día para logos e imágenes. No es más larga porque algunos
# archivos se reemplazan con el mismo nombre (flyers) y no queremos que quien
# ya los vio siga viendo la versión vieja. El HTML, CSS y JS no se tocan:
# Netlify los revalida en cada visita, así los cambios se ven al momento.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
